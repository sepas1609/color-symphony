<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Color Symphony · Boddu Saran</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0010;overflow:hidden;font-family:'Courier New',monospace;cursor:crosshair}
  canvas{display:block}
  #ui{position:fixed;top:16px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
  #ui h1{font-size:1rem;color:#ff007a;letter-spacing:3px;text-shadow:0 0 20px #ff007a}
  #ui p{font-size:.65rem;color:#666;margin-top:3px;letter-spacing:1px}
  #controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:10}
  button{background:rgba(255,0,122,.1);border:1px solid #ff007a44;color:#ff007a;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.7rem;letter-spacing:1px;transition:all .3s;font-family:'Courier New',monospace}
  button:hover{background:rgba(255,0,122,.25);box-shadow:0 0 12px #ff007a44}
  button.active{background:rgba(255,0,122,.3);box-shadow:0 0 16px #ff007a}
  #brushes{display:flex;gap:6px}
  .brush{width:28px;height:28px;border-radius:50%;border:2px solid #333;cursor:pointer;transition:all .3s}
  .brush.selected{border-color:#fff;box-shadow:0 0 10px currentColor}
  a{color:#00e5ff;text-decoration:none;font-size:.7rem;letter-spacing:2px;border:1px solid #00e5ff33;padding:5px 12px;border-radius:20px;background:rgba(0,229,255,.05)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>🎨🎵 COLOR SYMPHONY</h1>
  <p>Draw to make music · each stroke plays a tone</p>
</div>
<div id="controls">
  <div id="brushes"></div>
  <button id="muteBtn">🔇 Mute</button>
  <button id="clearBtn">✕ Clear</button>
  <a href="https://github.com/sepas1609" target="_blank">sepas1609</a>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W=c.width=innerWidth,H=c.height=innerHeight;
window.addEventListener('resize',()=>{W=c.width=innerWidth;H=c.height=innerHeight;ctx.fillStyle='#0a0010';ctx.fillRect(0,0,W,H)});
ctx.fillStyle='#0a0010';ctx.fillRect(0,0,W,H);

// Audio
let audioCtx=null,muted=false,lastNote=0;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playNote(freq,vol=0.08){
  if(muted||!audioCtx)return;
  const now=audioCtx.currentTime;
  if(now-lastNote<0.05)return;lastNote=now;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  const reverb=audioCtx.createGain();
  osc.connect(gain);gain.connect(reverb);reverb.connect(audioCtx.destination);
  osc.type='sine';osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(vol,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.8);
  reverb.gain.setValueAtTime(0.3,now);
  osc.start(now);osc.stop(now+0.8);
}

// Palette
const palettes=[
  {name:'Neon',colors:['#ff007a','#00e5ff','#7c3aed','#ff6b35','#10b981','#ffd21e']},
  {name:'Aurora',colors:['#00ff88','#00ccff','#aa44ff','#ff44aa','#44ffcc','#ffff44']},
  {name:'Fire',colors:['#ff4500','#ff8c00','#ffd700','#ff6347','#dc143c','#ff1493']},
];
const scales={
  pentatonic:[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880],
  minor:[261.63,311.13,349.23,392,466.16,523.25,622.25,698.46,783.99,932.33],
  major:[261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33,659.25],
};

let palette=palettes[0];let scale=scales.pentatonic;
let drawing=false,lastX=0,lastY=0,brushSize=8,colorIdx=0,trailPoints=[];
let currentColor=palette.colors[0];

// Build brush selector
const brushDiv=document.getElementById('brushes');
palette.colors.forEach((col,i)=>{
  const d=document.createElement('div');
  d.className='brush'+(i===0?' selected':'');
  d.style.background=col;d.style.boxShadow=`0 0 8px ${col}`;
  d.onclick=()=>{
    colorIdx=i;currentColor=col;
    document.querySelectorAll('.brush').forEach(b=>b.classList.remove('selected'));
    d.classList.add('selected');
  };
  brushDiv.appendChild(d);
});

const muteBtn=document.getElementById('muteBtn');
muteBtn.onclick=()=>{muted=!muted;muteBtn.textContent=muted?'🔊 Sound':'🔇 Mute';muteBtn.classList.toggle('active',!muted)};
document.getElementById('clearBtn').onclick=()=>{ctx.fillStyle='#0a0010';ctx.fillRect(0,0,W,H)};

function getFreq(x,y){
  const xi=Math.floor((x/W)*scale.length);
  const yi=Math.floor((y/H)*3);
  return scale[Math.min(xi,scale.length-1)]*Math.pow(2,yi);
}

function drawAt(x,y,px,py){
  initAudio();
  const freq=getFreq(x,y);
  playNote(freq,0.06+brushSize*0.003);

  const dx=x-px,dy=y-py;
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/4));
  for(let s=0;s<=steps;s++){
    const t=s/steps;
    const cx2=px+dx*t,cy2=py+dy*t;
    // Glow layer
    ctx.save();
    ctx.globalCompositeOperation='screen';
    const grd=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,brushSize*2.5);
    grd.addColorStop(0,currentColor+'cc');
    grd.addColorStop(0.4,currentColor+'44');
    grd.addColorStop(1,currentColor+'00');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(cx2,cy2,brushSize*2.5,0,Math.PI*2);ctx.fill();
    // Core
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=currentColor+'dd';
    ctx.beginPath();ctx.arc(cx2,cy2,brushSize*.6,0,Math.PI*2);ctx.fill();
    // Sparkles
    if(Math.random()>.6){
      const angle=Math.random()*Math.PI*2;
      const dist=brushSize*1.5+Math.random()*brushSize;
      const sx=cx2+Math.cos(angle)*dist,sy=cy2+Math.sin(angle)*dist;
      ctx.fillStyle=currentColor+'88';
      ctx.beginPath();ctx.arc(sx,sy,1,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

c.addEventListener('mousedown',e=>{drawing=true;lastX=e.clientX;lastY=e.clientY;initAudio()});
c.addEventListener('mouseup',()=>drawing=false);
c.addEventListener('mouseleave',()=>drawing=false);
c.addEventListener('mousemove',e=>{
  if(!drawing)return;
  drawAt(e.clientX,e.clientY,lastX,lastY);
  lastX=e.clientX;lastY=e.clientY;
});

c.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const t=e.touches[0];lastX=t.clientX;lastY=t.clientY;initAudio()},{passive:false});
c.addEventListener('touchend',()=>drawing=false);
c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];if(drawing){drawAt(t.clientX,t.clientY,lastX,lastY);lastX=t.clientX;lastY=t.clientY}},{passive:false});

// Ambient floating notes
let ambientFrame=0;
function ambient(){
  ambientFrame++;
  if(ambientFrame%120===0&&!muted&&audioCtx){
    const freq=scale[Math.floor(Math.random()*scale.length)];
    playNote(freq,0.02);
  }
  requestAnimationFrame(ambient);
}
ambient();
</script>
</body>
</html>
